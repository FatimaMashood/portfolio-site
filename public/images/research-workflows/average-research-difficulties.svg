<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc">
  <title id="title">Average position of research difficulties</title>
  <desc id="desc">Average positions for the listed research difficulties from eight answered responses. Higher values mean more difficult.</desc>
  <rect width="600" height="440" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#111827">
    <text x="24" y="32" font-size="19" font-weight="700">Average position of research difficulties</text>
    <text x="24" y="53" font-size="11" fill="#4b5563">Average position, 7 = most difficult</text>
    <g stroke="#e5e7eb" stroke-width="1">
      <path d="M285 78V365 M325 78V365 M366 78V365 M407 78V365 M448 78V365 M488 78V365 M529 78V365"/>
    </g>
    <g font-size="11" fill="#4b5563" text-anchor="middle">
      <text x="285" y="72">0</text><text x="325" y="72">1</text><text x="366" y="72">2</text><text x="407" y="72">3</text><text x="448" y="72">4</text><text x="488" y="72">5</text><text x="529" y="72">6</text><text x="570" y="72">7</text>
    </g>
    <g font-size="12">
      <text x="24" y="101">Collaborating with others</text><rect x="285" y="88" width="224" height="18" rx="3" fill="#4f46e5"/><text x="518" y="102" font-weight="700">5.50</text>
      <text x="24" y="141">Spending too much time reading</text><rect x="285" y="128" width="183" height="18" rx="3" fill="#4f46e5"/><text x="477" y="142" font-weight="700">4.50</text>
      <text x="24" y="181">Understanding complex research</text><rect x="285" y="168" width="183" height="18" rx="3" fill="#4f46e5"/><text x="477" y="182" font-weight="700">4.50</text>
      <text x="24" y="221">Keeping track of what I've read</text><rect x="285" y="208" width="163" height="18" rx="3" fill="#4f46e5"/><text x="457" y="222" font-weight="700">4.00</text>
      <text x="24" y="261">Remembering key information</text><rect x="285" y="248" width="153" height="18" rx="3" fill="#4f46e5"/><text x="447" y="262" font-weight="700">3.75</text>
      <text x="24" y="301">Connecting different research ideas</text><rect x="285" y="288" width="133" height="18" rx="3" fill="#4f46e5"/><text x="427" y="302" font-weight="700">3.25</text>
      <text x="24" y="341">Finding the right papers</text><rect x="285" y="328" width="102" height="18" rx="3" fill="#4f46e5"/><text x="396" y="342" font-weight="700">2.50</text>
    </g>
    <text x="24" y="408" font-size="11" fill="#4b5563">n=9 respondents; n=8 answered. Descriptive only.</text>
  </g>
</svg>
