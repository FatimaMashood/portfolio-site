<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title desc">
  <title id="title">Challenges when monitoring progress</title>
  <desc id="desc">Counts of three challenges when monitoring research progress among nine respondents.</desc>
  <rect width="600" height="320" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#111827">
    <text x="24" y="32" font-size="19" font-weight="700">Challenges when monitoring progress</text>
    <text x="24" y="53" font-size="11" fill="#4b5563">Number of respondents selecting each challenge</text>
    <g stroke="#e5e7eb" stroke-width="1">
      <path d="M285 78V245 M342 78V245 M399 78V245 M456 78V245 M513 78V245 M570 78V245"/>
    </g>
    <g font-size="11" fill="#4b5563" text-anchor="middle">
      <text x="285" y="72">0</text><text x="342" y="72">1</text><text x="399" y="72">2</text><text x="456" y="72">3</text><text x="513" y="72">4</text><text x="570" y="72">5</text>
    </g>
    <g font-size="12">
      <text x="24" y="101">Overwhelming amount of information</text><rect x="285" y="88" width="285" height="18" rx="3" fill="#4f46e5"/><text x="579" y="102" font-weight="700">5</text>
      <text x="24" y="141">Losing track of reading materials</text><rect x="285" y="128" width="171" height="18" rx="3" fill="#4f46e5"/><text x="465" y="142" font-weight="700">3</text>
      <text x="24" y="181">Lack of clear progress visualisation</text><rect x="285" y="168" width="57" height="18" rx="3" fill="#4f46e5"/><text x="351" y="182" font-weight="700">1</text>
    </g>
    <text x="24" y="288" font-size="11" fill="#4b5563">n=9 respondents. Descriptive only.</text>
  </g>
</svg>
