<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">Average importance position of features</title>
  <desc id="desc">Average importance positions for five features from eight answered responses. Higher values mean more important.</desc>
  <rect width="600" height="360" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#111827">
    <text x="24" y="32" font-size="19" font-weight="700">Average importance position of features</text>
    <text x="24" y="53" font-size="11" fill="#4b5563">Average position, 5 = most important</text>
    <g stroke="#e5e7eb" stroke-width="1">
      <path d="M285 78V285 M342 78V285 M399 78V285 M456 78V285 M513 78V285 M570 78V285"/>
    </g>
    <g font-size="11" fill="#4b5563" text-anchor="middle">
      <text x="285" y="72">0</text><text x="342" y="72">1</text><text x="399" y="72">2</text><text x="456" y="72">3</text><text x="513" y="72">4</text><text x="570" y="72">5</text>
    </g>
    <g font-size="12">
      <text x="24" y="101">Progress tracking and metrics</text><rect x="285" y="88" width="221" height="18" rx="3" fill="#4f46e5"/><text x="515" y="102" font-weight="700">3.88</text>
      <text x="24" y="141">Personalised research guidance</text><rect x="285" y="128" width="214" height="18" rx="3" fill="#4f46e5"/><text x="508" y="142" font-weight="700">3.75</text>
      <text x="24" y="181">Visual connections between research papers</text><rect x="285" y="168" width="171" height="18" rx="3" fill="#4f46e5"/><text x="465" y="182" font-weight="700">3.00</text>
      <text x="24" y="221">Ability to ask AI questions about research papers</text><rect x="285" y="208" width="128" height="18" rx="3" fill="#4f46e5"/><text x="422" y="222" font-weight="700">2.25</text>
      <text x="24" y="261">Automatic summarization and key findings</text><rect x="285" y="248" width="121.41" height="18" rx="3" fill="#4f46e5"/><text x="415.41" y="262" font-weight="700">2.13</text>
    </g>
    <text x="24" y="328" font-size="11" fill="#4b5563">n=9 respondents; n=8 answered. Descriptive only.</text>
  </g>
</svg>
